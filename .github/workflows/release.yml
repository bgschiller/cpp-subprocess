name: Release

on:
  push:
    tags:
      - "v*"

env:
  PROJECT_NAME: "subprocess"
  BUILD_TYPE: Release
  INSTALL_LOCATION: .local

jobs:
  build:
    name: ${{ matrix.config.name }}
    runs-on: ${{ matrix.config.os }}
    strategy:
      fail-fast: false
      matrix:
        config:
          - {
              name: "Windows Latest MSVC",
              artifact_ext: ".zip",
              os: windows-latest,
              cc: "cl",
              cxx: "cl",
            }
          - {
              name: "Ubuntu Latest GCC",
              artifact_ext: ".tar.gz",
              os: ubuntu-latest,
              cc: "gcc",
              cxx: "g++",
            }
          - {
              name: "macOS Latest Clang",
              artifact_ext: ".tar.gz",
              os: macos-latest,
              cc: "clang",
              cxx: "clang++",
            }

    steps:
      - name: set version name (Windows)
        id: version_win
        if: ${{ runner.os == 'Windows' }}
        run: |
          $TAG = (${env:GITHUB_REF} -replace 'refs/tags/', '')
          echo "name=$TAG" >> $env:GITHUB_OUTPUT

      - name: set version name
        id: version
        if: ${{ runner.os != 'Windows' }}
        run: echo "name=${GITHUB_REF#refs/tags/}" >> $GITHUB_OUTPUT

      - name: Checkout
        uses: actions/checkout@v4
        with:
          submodules: recursive

      - name: cache dependencies
        uses: actions/cache@v4
        id: cache
        with:
          path: ${{ github.workspace }}/${{ env.INSTALL_LOCATION }}
          key: ${{ runner.os }}-dependencies

      - name: install Catch2
        if: ${{ steps.cache.outputs.cache-hit != 'true' }}
        run: |
          cd ..
          git clone https://github.com/catchorg/Catch2.git --branch v2.x
          cd Catch2
          cmake -Bbuild -DCMAKE_INSTALL_PREFIX=$GITHUB_WORKSPACE/$INSTALL_LOCATION
          cmake --build build --config Release
          cmake --build build --target install --config Release
          cd ../Subprocess

      - name: configure
        run: cmake -Bbuild -DCMAKE_INSTALL_PREFIX="$HOME/.local"

      - name: build
        run: cmake --build build --config ${{ env.BUILD_TYPE }} -j4

      - name: run tests
        run: |
          cd build
          ctest -C ${{ env.BUILD_TYPE }} -VV

      - name: generate archive (Windows)
        if: ${{ runner.os == 'Windows' }}
        run: |
          rmdir -r -fo build
          7z a -tzip $HOME/artifact.zip *

      - name: generate archive
        if: ${{ runner.os != 'Windows' }}
        run: |
          rm -rf build
          tar -cvzf $HOME/artifact.tar.gz .

      - name: upload artifacts (Windows)
        uses: actions/upload-artifact@v4
        if: ${{ runner.os == 'Windows' }}
        with:
          name: ${{ runner.os }}-${{ steps.version_win.outputs.name }}
          path: "~/artifact.*"

      - name: upload artifacts
        uses: actions/upload-artifact@v4
        if: ${{ runner.os != 'Windows' }}
        with:
          name: ${{ runner.os }}-${{ steps.version.outputs.name }}
          path: "~/artifact.*"

  release:
    if: contains(github.ref, 'tags/v')
    runs-on: ubuntu-latest
    needs: build

    steps:
      - name: set version name
        id: version
        run: echo "name=${GITHUB_REF#refs/tags/}" >> $GITHUB_OUTPUT

      - name: download Linux artifact
        uses: actions/download-artifact@v4
        with:
          name: "Linux-${{ steps.version.outputs.name }}"
          path: ./linux/

      - name: download Windows artifact
        uses: actions/download-artifact@v4
        with:
          name: "Windows-${{ steps.version.outputs.name }}"
          path: ./windows/

      - name: download macOS artifact
        uses: actions/download-artifact@v4
        with:
          name: "macOS-${{ steps.version.outputs.name }}"
          path: ./macos/

      - name: rename artifacts
        run: |
          mv linux/artifact.tar.gz ${{ env.PROJECT_NAME }}-Linux-${{ steps.version.outputs.name }}.tar.gz
          mv windows/artifact.zip ${{ env.PROJECT_NAME }}-Windows-${{ steps.version.outputs.name }}.zip
          mv macos/artifact.tar.gz ${{ env.PROJECT_NAME }}-macOS-${{ steps.version.outputs.name }}.tar.gz

      - name: create release
        uses: softprops/action-gh-release@v2
        with:
          name: Release ${{ steps.version.outputs.name }}
          files: |
            ${{ env.PROJECT_NAME }}-Linux-${{ steps.version.outputs.name }}.tar.gz
            ${{ env.PROJECT_NAME }}-Windows-${{ steps.version.outputs.name }}.zip
            ${{ env.PROJECT_NAME }}-macOS-${{ steps.version.outputs.name }}.tar.gz
